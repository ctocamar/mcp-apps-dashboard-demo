[project]
name = "mcp-apps-dashboard-demo"
version = "0.1.0"
description = "Servidor MCP de demo que expone el tool panel_metricas como MCP App (dashboard interactivo)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=3.2",
]

[project.scripts]
panel-metricas = "server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["server", "generate_preview"]
packages = ["metrics_app", "metrics_app.templates"]

[tool.setuptools.package-data]
"metrics_app.templates" = ["*.html"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
