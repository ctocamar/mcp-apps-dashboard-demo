<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panel de métricas</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --panel: #f7f8fa;
    --ink: #1a1c22;
    --muted: #5b6270;
    --grid: #e3e6ec;
    --accent: #2563eb;
    --accent-2: #7c3aed;
    --bar-from: #3b82f6;
    --bar-to: #2563eb;
    --shadow: 0 1px 3px rgba(16, 24, 40, .08), 0 1px 2px rgba(16, 24, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117;
      --panel: #161923;
      --ink: #eef1f7;
      --muted: #9aa3b2;
      --grid: #262b37;
      --accent: #60a5fa;
      --bar-from: #60a5fa;
      --bar-to: #3b82f6;
      --shadow: 0 1px 3px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 16px;
  }
  .card {
    max-width: 720px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--grid);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 20px;
  }
  .head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }
  h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
  .controls { display: flex; align-items: center; gap: 8px; }
  label { color: var(--muted); font-size: 13px; }
  select {
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--grid);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
  }
  select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .summary { display: flex; gap: 22px; margin: 14px 2px 6px; }
  .kpi .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .kpi .v { font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
  .chart-wrap { width: 100%; overflow-x: auto; }
  canvas { display: block; width: 100%; height: 300px; max-width: 100%; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
  <div class="card" role="group" aria-label="Panel de métricas">
    <div class="head">
      <h1>Panel de métricas</h1>
      <div class="controls">
        <label for="dataset-select">Dataset</label>
        <select id="dataset-select" aria-label="Seleccionar dataset"></select>
      </div>
    </div>

    <div class="summary">
      <div class="kpi">
        <div class="k">Total</div>
        <div class="v" id="kpi-total">—</div>
      </div>
      <div class="kpi">
        <div class="k">Media</div>
        <div class="v" id="kpi-avg">—</div>
      </div>
    </div>

    <div class="chart-wrap">
      <canvas id="chart" role="img" aria-label="Gráfico de barras del dataset seleccionado"></canvas>
    </div>

    <p class="foot" id="foot">MCP App de demostración · datos ficticios · render 100% local en el iframe.</p>
  </div>

<script>
  // ---------------------------------------------------------------------------
  // Datos inyectados por el servidor (mcp-ui-server / create_ui_resource).
  // El renderizador Python sustituye el token [{"key": "ventas", "label": "Ventas", "unit": "€", "categories": ["Ene", "Feb", "Mar", "Abr", "May", "Jun"], "values": [12400.0, 15800.0, 14200.0, 19100.0, 22600.0, 20800.0]}, {"key": "visitas", "label": "Visitas", "unit": "visitas", "categories": ["Ene", "Feb", "Mar", "Abr", "May", "Jun"], "values": [8200.0, 9100.0, 12500.0, 11800.0, 15300.0, 17600.0]}] por un array JSON.
  // No hay ninguna llamada de red: todo se resuelve aquí, en el cliente.
  // ---------------------------------------------------------------------------
  const MCP_DATA = [{"key": "ventas", "label": "Ventas", "unit": "€", "categories": ["Ene", "Feb", "Mar", "Abr", "May", "Jun"], "values": [12400.0, 15800.0, 14200.0, 19100.0, 22600.0, 20800.0]}, {"key": "visitas", "label": "Visitas", "unit": "visitas", "categories": ["Ene", "Feb", "Mar", "Abr", "May", "Jun"], "values": [8200.0, 9100.0, 12500.0, 11800.0, 15300.0, 17600.0]}];

  const byKey = Object.fromEntries(MCP_DATA.map(function (d) { return [d.key, d]; }));
  const select = document.getElementById("dataset-select");
  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");

  // Poblar el selector desde los datos.
  MCP_DATA.forEach(function (d) {
    const opt = document.createElement("option");
    opt.value = d.key;
    opt.textContent = d.label;
    select.appendChild(opt);
  });

  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function formatValue(v, unit) {
    const n = new Intl.NumberFormat("es-ES").format(Math.round(v));
    return unit === "€" ? n + " €" : n + " " + unit;
  }

  function drawChart(ds) {
    // Escalado nítido en pantallas HiDPI.
    const dpr = window.devicePixelRatio || 1;
    const cssW = canvas.clientWidth || 640;
    const cssH = canvas.clientHeight || 300;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);

    const padL = 48, padR = 12, padT = 16, padB = 34;
    const plotW = cssW - padL - padR;
    const plotH = cssH - padT - padB;
    const maxV = Math.max.apply(null, ds.values) || 1;

    const inkGrid = css("--grid");
    const inkMuted = css("--muted");
    const barFrom = css("--bar-from");
    const barTo = css("--bar-to");

    // Líneas de referencia + etiquetas del eje Y (4 divisiones).
    ctx.textBaseline = "middle";
    ctx.font = "11px sans-serif";
    const steps = 4;
    for (let i = 0; i <= steps; i++) {
      const y = padT + plotH - (plotH * i) / steps;
      ctx.strokeStyle = inkGrid;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + plotW, y);
      ctx.stroke();
      ctx.fillStyle = inkMuted;
      ctx.textAlign = "right";
      const val = (maxV * i) / steps;
      ctx.fillText(new Intl.NumberFormat("es-ES", { notation: "compact" }).format(val), padL - 8, y);
    }

    // Barras + etiquetas del eje X.
    const n = ds.values.length;
    const slot = plotW / n;
    const barW = Math.min(48, slot * 0.6);
    for (let i = 0; i < n; i++) {
      const v = ds.values[i];
      const h = (v / maxV) * plotH;
      const x = padL + slot * i + (slot - barW) / 2;
      const y = padT + plotH - h;

      const grad = ctx.createLinearGradient(0, y, 0, y + h);
      grad.addColorStop(0, barFrom);
      grad.addColorStop(1, barTo);
      ctx.fillStyle = grad;
      const r = Math.min(6, barW / 2);
      roundRect(ctx, x, y, barW, h, r);
      ctx.fill();

      ctx.fillStyle = inkMuted;
      ctx.textAlign = "center";
      ctx.fillText(ds.categories[i], x + barW / 2, padT + plotH + 14);
    }
  }

  function roundRect(c, x, y, w, h, r) {
    if (h <= 0) return;
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, 0);
    c.arcTo(x, y + h, x, y, 0);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function render(key) {
    const ds = byKey[key];
    if (!ds) return;
    const total = ds.values.reduce(function (a, b) { return a + b; }, 0);
    const avg = total / ds.values.length;

    document.getElementById("kpi-total").textContent = formatValue(total, ds.unit);
    document.getElementById("kpi-avg").textContent = formatValue(avg, ds.unit);
    drawChart(ds);

    // Hooks de observabilidad para verificación automatizada (Claude in Chrome):
    // afirmar el cambio de dataset sin depender de leer píxeles del canvas.
    document.body.dataset.currentDataset = key;
    window.__chartTotal = Math.round(total);
    window.__chartLabel = ds.label;
  }

  select.addEventListener("change", function () { render(select.value); });
  window.addEventListener("resize", function () { render(select.value); });

  // Render inicial con el primer dataset.
  select.value = MCP_DATA[0].key;
  render(select.value);
</script>
</body>
</html>
